<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>策划晨宇制作</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

    /* 顶部栏 */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 600;
      background: linear-gradient(135deg, #fb7299, #23ade5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }
    .search-box {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 300px;
    }
    .search-box input {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #2d3139;
      border-radius: 8px;
      background: #1a1d26;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: #fb7299; }
    .search-box button {
      padding: 10px 24px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #fb7299, #ff8fb3);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .search-box button:hover { opacity: 0.9; }
    .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }
    .range-select {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #888;
    }
    .range-select select {
      padding: 8px 12px;
      border: 1px solid #2d3139;
      border-radius: 8px;
      background: #1a1d26;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .range-select select:focus { border-color: #fb7299; }

    /* UP主信息卡片 */
    .up-card {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 24px;
      background: linear-gradient(135deg, #1a1d26, #1e2230);
      border-radius: 16px;
      border: 1px solid #2d3139;
      margin-bottom: 20px;
    }
    .up-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid #fb7299;
      object-fit: cover;
      flex-shrink: 0;
      background: #2d3139;
    }
    .up-info { flex: 1; min-width: 0; }
    .up-name {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .up-name .vip-badge {
      font-size: 11px;
      padding: 2px 8px;
      background: linear-gradient(135deg, #fb7299, #ff8fb3);
      border-radius: 4px;
      color: #fff;
    }
    .up-name .level-badge {
      font-size: 11px;
      padding: 2px 8px;
      background: #23ade5;
      border-radius: 4px;
      color: #fff;
    }
    .up-sign { font-size: 13px; color: #999; margin-bottom: 10px; line-height: 1.5; }
    .up-stats { display: flex; gap: 32px; }
    .up-stat { text-align: center; }
    .up-stat .num {
      font-size: 22px;
      font-weight: 700;
      color: #fb7299;
    }
    .up-stat .label { font-size: 12px; color: #888; margin-top: 2px; }

    /* 汇总统计卡片 */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .summary-card {
      padding: 16px;
      background: #1a1d26;
      border-radius: 12px;
      border: 1px solid #2d3139;
      text-align: center;
    }
    .summary-card .num { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .summary-card .label { font-size: 12px; color: #888; }
    .c-view { color: #23ade5; }
    .c-like { color: #fb7299; }
    .c-coin { color: #ffc107; }
    .c-fav { color: #4caf50; }
    .c-share { color: #9c27b0; }
    .c-reply { color: #ff5722; }
    .c-danmaku { color: #00bcd4; }

    /* 图表区域 */
    .chart-section {
      padding: 20px;
      background: #1a1d26;
      border-radius: 12px;
      border: 1px solid #2d3139;
      margin-bottom: 20px;
    }
    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .chart-header h3 { font-size: 15px; font-weight: 500; color: #ccc; }
    .metric-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .metric-tab {
      padding: 6px 14px;
      border: 1px solid #2d3139;
      border-radius: 20px;
      background: transparent;
      color: #888;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .metric-tab:hover { border-color: #fb7299; color: #fb7299; }
    .metric-tab.active {
      background: rgba(251,114,153,0.15);
      border-color: #fb7299;
      color: #fb7299;
    }
    .chart-container { position: relative; height: 320px; }
    .chart-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: #666;
      font-size: 14px;
    }

    /* 视频表格 */
    .video-section {
      background: #1a1d26;
      border-radius: 12px;
      border: 1px solid #2d3139;
      overflow: hidden;
    }
    .video-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #2d3139;
      flex-wrap: wrap;
      gap: 10px;
    }
    .video-section-header h3 { font-size: 15px; font-weight: 500; color: #ccc; }
    .video-actions { display: flex; gap: 8px; align-items: center; }
    .video-actions span { font-size: 12px; color: #888; }
    .btn-small {
      padding: 5px 12px;
      border: 1px solid #2d3139;
      border-radius: 6px;
      background: transparent;
      color: #aaa;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-small:hover { border-color: #fb7299; color: #fb7299; }
    .table-wrap { overflow-x: auto; max-height: 600px; overflow-y: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead th {
      padding: 10px 12px;
      text-align: left;
      background: #1e2230;
      color: #999;
      font-weight: 500;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    tbody td {
      padding: 8px 12px;
      border-bottom: 1px solid #252830;
      color: #ccc;
      vertical-align: middle;
    }
    tbody tr:hover { background: rgba(251,114,153,0.05); }
    tbody tr.selected { background: rgba(251,114,153,0.1); }
    .check-cell { width: 30px; text-align: center; }
    .check-cell input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #fb7299;
    }
    .video-cover {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
      background: #2d3139;
      flex-shrink: 0;
    }
    .cover-cell { width: 140px; }
    .video-title {
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      cursor: pointer;
      color: #e0e0e0;
      line-height: 1.4;
    }
    .video-title:hover { color: #fb7299; }
    .video-date { white-space: nowrap; color: #888; font-size: 12px; }
    .num-cell { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

    /* 加载和空状态 */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    .loading .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid #2d3139;
      border-top-color: #fb7299;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: #666;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
    .error-msg {
      text-align: center;
      padding: 40px 20px;
      color: #ff4d4f;
    }

    /* 响应式 */
    @media (max-width: 900px) {
      .up-card { flex-direction: column; text-align: center; }
      .up-stats { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>策划晨宇——B站数据分析仪</h1>
      <div class="search-box">
        <input type="text" id="midInput" placeholder="输入UP主UID（如 114514），回车搜索" list="midPresets" autocomplete="off" />
        <datalist id="midPresets">
          <option value="389712930">白问豆豆</option>
          <option value="8969156">小白测评</option>
        </datalist>
        <button id="searchBtn" onclick="searchUP()">查询</button>
      </div>
      <div class="range-select">
        <label>视频范围：</label>
        <select id="daysSelect" onchange="searchUP()">
          <option value="7">近7天</option>
          <option value="30">近30天</option>
          <option value="90">近90天</option>
          <option value="180">近180天</option>
          <option value="365">近1年</option>
          <option value="0" selected>全部</option>
        </select>
      </div>
    </div>

    <div id="content">
      <div class="empty-state">
        <div class="icon">👨‍💻</div>
        <p>输入UP主UID，查看粉丝量、视频数据和对比趋势</p>
      </div>
    </div>
  </div>

  <script>
    let currentData = null;
    let selectedBvids = new Set();
    let currentMetric = 'view';
    let chart = null;

    const METRICS = [
      { key: 'view', label: '播放量', color: '#23ade5' },
      { key: 'like', label: '点赞', color: '#fb7299' },
      { key: 'coin', label: '投币', color: '#ffc107' },
      { key: 'favorite', label: '收藏', color: '#4caf50' },
      { key: 'share', label: '分享', color: '#9c27b0' },
      { key: 'reply', label: '评论', color: '#ff5722' },
      { key: 'danmaku', label: '弹幕', color: '#00bcd4' },
    ];

    document.getElementById('midInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') searchUP();
    });

    function formatNum(n) {
      if (n == null) return '-';
      if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
      if (n >= 10000) return (n / 10000).toFixed(1) + '万';
      return n.toLocaleString();
    }

    function formatDate(ts) {
      const d = new Date(ts * 1000);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    // 图片代理：防盗链兜底
    function proxyImg(url) {
      if (!url) return '';
      return '/proxy/image?url=' + encodeURIComponent(url);
    }

    async function searchUP() {
      const mid = document.getElementById('midInput').value.trim();
      if (!mid || !/^\d+$/.test(mid)) {
        alert('请输入有效的UP主UID（纯数字）');
        return;
      }
      selectedBvids.clear();
      currentMetric = 'view';

      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      btn.textContent = '查询中...';

      document.getElementById('content').innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>正在获取UP主数据，视频较多时请稍候...</p>
        </div>`;

      try {
        const res = await fetch(`/api/up?mid=${mid}&days=${document.getElementById('daysSelect').value}&limit=100`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        currentData = data;
        renderUP(data);
        loadFanTrend(mid);
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="error-msg">
            <p>❌ 获取数据失败：${err.message}</p>
            <p style="font-size:12px;color:#888;margin-top:8px;">可能原因：UID不存在、网络问题、B站接口限流</p>
          </div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '查询';
      }
    }

    function renderUP(data) {
      const { userInfo, videos } = data;
      const v = videos || [];
      currentData = data;
      const daysVal = document.getElementById('daysSelect')?.value || '0';
      const daysLabel = daysVal === '0' ? '' : ` · 近${daysVal}天`;

      // 默认勾选前5个视频
      selectedBvids = new Set(v.slice(0, 5).map(item => item.bvid));

      let html = '';

      // UP主信息卡
      html += `
        <div class="up-card">
          <img class="up-avatar" src="${proxyImg(userInfo.face)}"
               onerror="this.src='${userInfo.face}';this.onerror=null;"
               alt="${userInfo.name}" />
          <div class="up-info">
            <div class="up-name">
              ${userInfo.name}
              ${userInfo.vip ? '<span class="vip-badge">大会员</span>' : ''}
              ${userInfo.level ? `<span class="level-badge">LV${userInfo.level}</span>` : ''}
            </div>
            <div class="up-sign">${userInfo.sign || '这个人很懒，什么都没写'}</div>
            <div class="up-stats">
              <div class="up-stat">
                <div class="num">${formatNum(userInfo.follower)}</div>
                <div class="label">粉丝数</div>
              </div>
              <div class="up-stat">
                <div class="num">${formatNum(userInfo.following)}</div>
                <div class="label">关注数</div>
              </div>
              <div class="up-stat">
                <div class="num c-view">${formatNum(userInfo.totalView)}</div>
                <div class="label">总播放</div>
              </div>
              <div class="up-stat">
                <div class="num c-like">${formatNum(userInfo.totalLikes)}</div>
                <div class="label">总获赞</div>
              </div>
                          </div>
          </div>
        </div>`;

      // 粉丝趋势图表区域
      html += `
        <div class="chart-section">
          <div class="chart-header">
            <h3>📈 粉丝数历史趋势</h3>
            <div class="metric-tabs">
              <button class="metric-tab active" onclick="switchFanRange('all', this)">全部</button>
              <button class="metric-tab" onclick="switchFanRange('365', this)">近1年</button>
              <button class="metric-tab" onclick="switchFanRange('90', this)">近90天</button>
              <button class="metric-tab" onclick="switchFanRange('30', this)">近30天</button>
            </div>
          </div>
          <div class="chart-container" id="fanChartContainer">
            <div class="chart-empty">正在加载粉丝趋势数据...</div>
          </div>
        </div>`;

      // 对比图表区域
      html += `
        <div class="chart-section">
          <div class="chart-header">
            <h3>📈 视频数据对比（勾选下方视频后自动更新）</h3>
            <div class="metric-tabs">
              ${METRICS.map(m => `
                <button class="metric-tab ${m.key === currentMetric ? 'active' : ''}"
                        onclick="switchMetric('${m.key}')">${m.label}</button>
              `).join('')}
            </div>
          </div>
          <div class="chart-container">
            <canvas id="compareChart"></canvas>
          </div>
        </div>`;

      // 视频表格
      html += `
        <div class="video-section">
          <div class="video-section-header">
            <h3>📹 视频数据（共 ${v.length} 条${daysLabel}）</h3>
            <div class="video-actions">
              <span id="selectedCount">已选 ${selectedBvids.size} 个</span>
              <button class="btn-small" onclick="selectAllVideos()">全选</button>
              <button class="btn-small" onclick="clearAllVideos()">清空</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="check-cell"><input type="checkbox" id="checkAll" onchange="toggleSelectAll(this)"></th>
                  <th>封面</th>
                  <th>视频标题</th>
                  <th>发布日期</th>
                  <th class="num-cell">播放</th>
                  <th class="num-cell">点赞</th>
                  <th class="num-cell">投币</th>
                  <th class="num-cell">收藏</th>
                  <th class="num-cell">分享</th>
                  <th class="num-cell">评论</th>
                  <th class="num-cell">弹幕</th>
                </tr>
              </thead>
              <tbody>
                ${v.map((item, idx) => `
                  <tr class="${selectedBvids.has(item.bvid) ? 'selected' : ''}" data-bvid="${item.bvid}">
                    <td class="check-cell">
                      <input type="checkbox" ${selectedBvids.has(item.bvid) ? 'checked' : ''}
                             onchange="toggleVideo('${item.bvid}', this)">
                    </td>
                    <td class="cover-cell">
                      <img class="video-cover" src="${proxyImg(item.pic)}"
                           onerror="this.style.display='none'"
                           alt="封面" loading="lazy">
                    </td>
                    <td class="video-title" onclick="window.open('https://www.bilibili.com/video/${item.bvid}','_blank')" title="${item.title}">${item.title}</td>
                    <td class="video-date">${formatDate(item.pubdate)}</td>
                    <td class="num-cell c-view">${formatNum(item.stat?.view)}</td>
                    <td class="num-cell c-like">${formatNum(item.stat?.like)}</td>
                    <td class="num-cell c-coin">${formatNum(item.stat?.coin)}</td>
                    <td class="num-cell c-fav">${formatNum(item.stat?.favorite)}</td>
                    <td class="num-cell c-share">${formatNum(item.stat?.share)}</td>
                    <td class="num-cell c-reply">${formatNum(item.stat?.reply)}</td>
                    <td class="num-cell c-danmaku">${formatNum(item.stat?.danmaku)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>`;

      document.getElementById('content').innerHTML = html;
      renderChart();
    }

    function toggleVideo(bvid, checkbox) {
      if (checkbox.checked) {
        selectedBvids.add(bvid);
      } else {
        selectedBvids.delete(bvid);
      }
      const row = checkbox.closest('tr');
      row.classList.toggle('selected', checkbox.checked);
      document.getElementById('selectedCount').textContent = `已选 ${selectedBvids.size} 个`;
      renderChart();
    }

    function toggleSelectAll(checkbox) {
      const rows = document.querySelectorAll('tbody tr');
      rows.forEach(row => {
        const cb = row.querySelector('input[type="checkbox"]');
        const bvid = row.dataset.bvid;
        cb.checked = checkbox.checked;
        if (checkbox.checked) {
          selectedBvids.add(bvid);
          row.classList.add('selected');
        } else {
          selectedBvids.delete(bvid);
          row.classList.remove('selected');
        }
      });
      document.getElementById('selectedCount').textContent = `已选 ${selectedBvids.size} 个`;
      renderChart();
    }

    function selectAllVideos() {
      document.querySelectorAll('tbody input[type="checkbox"]').forEach(cb => {
        cb.checked = true;
        const bvid = cb.closest('tr').dataset.bvid;
        selectedBvids.add(bvid);
        cb.closest('tr').classList.add('selected');
      });
      document.getElementById('checkAll').checked = true;
      document.getElementById('selectedCount').textContent = `已选 ${selectedBvids.size} 个`;
      renderChart();
    }

    function clearAllVideos() {
      document.querySelectorAll('tbody input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
        cb.closest('tr').classList.remove('selected');
      });
      selectedBvids.clear();
      document.getElementById('checkAll').checked = false;
      document.getElementById('selectedCount').textContent = `已选 0 个`;
      renderChart();
    }

    function switchMetric(metric) {
      currentMetric = metric;
      document.querySelectorAll('.metric-tab').forEach(tab => {
        tab.classList.toggle('active', tab.textContent === METRICS.find(m => m.key === metric)?.label);
      });
      renderChart();
    }

    function renderChart() {
      const ctx = document.getElementById('compareChart');
      if (!ctx || !currentData) return;

      const videos = currentData.videos || [];
      const selected = videos.filter(v => selectedBvids.has(v.bvid));
      const metricInfo = METRICS.find(m => m.key === currentMetric);

      if (chart) {
        chart.destroy();
        chart = null;
      }

      if (selected.length === 0) {
        ctx.parentElement.innerHTML = '<div class="chart-empty">请在下方表格中勾选视频，即可生成对比图表</div>';
        return;
      }

      // 按发布时间排序
      selected.sort((a, b) => a.pubdate - b.pubdate);

      const labels = selected.map(v => {
        const title = v.title.length > 12 ? v.title.slice(0, 12) + '…' : v.title;
        return title;
      });
      const values = selected.map(v => v.stat?.[currentMetric] || 0);

      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: metricInfo.label,
            data: values,
            backgroundColor: values.map((_, i) => {
              const alpha = 0.7 + (i / values.length) * 0.3;
              return metricInfo.color + Math.round(alpha * 255).toString(16).padStart(2, '0');
            }),
            borderColor: metricInfo.color,
            borderWidth: 1,
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1a1d26',
              titleColor: '#e0e0e0',
              bodyColor: '#ccc',
              borderColor: '#2d3139',
              borderWidth: 1,
              callbacks: {
                title: (items) => {
                  const idx = items[0].dataIndex;
                  return selected[idx]?.title || '';
                },
                label: (item) => `${metricInfo.label}: ${formatNum(item.raw)}`,
              }
            }
          },
          scales: {
            x: {
              ticks: { color: '#888', font: { size: 11 }, maxRotation: 45, minRotation: 0 },
              grid: { display: false },
            },
            y: {
              ticks: { color: '#888', callback: v => formatNum(v) },
              grid: { color: '#252830' },
            }
          }
        }
      });
    }

    // ========== 粉丝趋势（zeroroku数据）==========
    let fanChart = null;
    let fanData = [];
    let fanRange = 'all';

    async function loadFanTrend(mid) {
      const container = document.getElementById('fanChartContainer');
      if (!container) return;
      container.innerHTML = '<div class="chart-empty">正在加载粉丝趋势数据...</div>';
      try {
        const res = await fetch(`/api/zeroroku?mid=${mid}`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        fanData = data.history || [];
        console.log(`粉丝趋势数据: ${fanData.length} 条`);
        renderFanChart();
      } catch (err) {
        container.innerHTML = `<div class="chart-empty" style="color:#ff4d4f;">粉丝趋势加载失败：${err.message}</div>`;
      }
    }

    function switchFanRange(range, btn) {
      fanRange = range;
      const fanSection = document.getElementById('fanChartContainer').closest('.chart-section');
      fanSection.querySelectorAll('.metric-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderFanChart();
    }

    function renderFanChart() {
      const container = document.getElementById('fanChartContainer');
      if (!container || fanData.length === 0) return;

      let data = fanData;
      if (fanRange !== 'all') {
        const days = parseInt(fanRange);
        const cutoff = Date.now() - days * 24 * 3600 * 1000;
        data = fanData.filter(d => new Date(d.time).getTime() >= cutoff);
      }

      // 数据点太多时抽样
      const maxPoints = 500;
      if (data.length > maxPoints) {
        const step = Math.ceil(data.length / maxPoints);
        data = data.filter((_, i) => i % step === 0);
      }

      container.innerHTML = '<canvas id="fanChart"></canvas>';
      const ctx = document.getElementById('fanChart');

      if (fanChart) { fanChart.destroy(); fanChart = null; }

      const labels = data.map(d => {
        const date = new Date(d.time);
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      });
      const values = data.map(d => d.fans);

      fanChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: '粉丝数',
            data: values,
            borderColor: '#fb7299',
            backgroundColor: 'rgba(251,114,153,0.1)',
            fill: true,
            tension: 0.2,
            pointRadius: 0,
            pointHoverRadius: 5,
            borderWidth: 2,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#1a1d26',
              titleColor: '#e0e0e0',
              bodyColor: '#ccc',
              borderColor: '#2d3139',
              borderWidth: 1,
              callbacks: {
                label: (item) => {
                  const idx = item.dataIndex;
                  const d = data[idx];
                  const msg = [`粉丝数: ${formatNum(d.fans)}`];
                  if (d.rate1 != null) msg.push(`日变化: ${d.rate1 >= 0 ? '+' : ''}${d.rate1}`);
                  if (d.rate7 != null) msg.push(`7日变化: ${d.rate7 >= 0 ? '+' : ''}${d.rate7}`);
                  return msg;
                }
              }
            }
          },
          scales: {
            x: { ticks: { color: '#888', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#252830' } },
            y: { ticks: { color: '#888', callback: v => formatNum(v) }, grid: { color: '#252830' } },
          }
        }
      });
    }
  </script>
</body>
